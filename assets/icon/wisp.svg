<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Wisp Player: a retro cassette player</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3358"/>
      <stop offset="1" stop-color="#0e0d16"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8eed6"/>
      <stop offset="1" stop-color="#d6c7a3"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5470"/>
      <stop offset="1" stop-color="#d4203d"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a66"/>
      <stop offset="1" stop-color="#2c2c35"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3644"/>
      <stop offset="1" stop-color="#24212b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <g id="hub">
      <circle r="11" fill="#f3f1ea"/>
      <circle r="6.2" fill="#1d1d25"/>
      <g fill="#f3f1ea">
        <rect x="-1.5" y="-7.8" width="3" height="4" rx=".7"/>
        <rect x="-1.5" y="-7.8" width="3" height="4" rx=".7" transform="rotate(60)"/>
        <rect x="-1.5" y="-7.8" width="3" height="4" rx=".7" transform="rotate(120)"/>
        <rect x="-1.5" y="-7.8" width="3" height="4" rx=".7" transform="rotate(180)"/>
        <rect x="-1.5" y="-7.8" width="3" height="4" rx=".7" transform="rotate(240)"/>
        <rect x="-1.5" y="-7.8" width="3" height="4" rx=".7" transform="rotate(300)"/>
      </g>
    </g>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <path d="M8 66a58 58 0 0 1 58-58h124a58 58 0 0 1 58 58v50H8z" fill="url(#gloss)"/>

  <!-- player body -->
  <g filter="url(#shadow)">
    <rect x="26" y="60" width="204" height="140" rx="22" fill="url(#body)"/>
  </g>
  <rect x="26" y="60" width="204" height="140" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
  <!-- red stripe, speaker slits and a lamp along the top -->
  <path d="M26 82a22 22 0 0 1 22-22h160a22 22 0 0 1 22 22v1H26z" fill="url(#red)"/>
  <g stroke="#a9182f" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round">
    <path d="M158 70h50M158 75.5h50"/>
  </g>
  <circle cx="48" cy="72" r="4.2" fill="#fff4f4" fill-opacity=".92"/>

  <!-- cassette window -->
  <rect x="44" y="90" width="168" height="68" rx="10" fill="#17171e"/>
  <rect x="44" y="90" width="168" height="68" rx="10" fill="none" stroke="#a89a78" stroke-width="2.4"/>
  <!-- the cassette -->
  <rect x="50" y="96" width="156" height="56" rx="6" fill="url(#shell)"/>
  <rect x="57" y="100" width="142" height="16" rx="3" fill="#efe3c4"/>
  <rect x="57" y="100" width="142" height="5" rx="2.5" fill="url(#red)"/>
  <path d="M65 111.5h46M119 111.5h30" stroke="#8f8468" stroke-width="1.7" stroke-linecap="round"/>
  <!-- reels, with the tape wound on them -->
  <circle cx="92" cy="133" r="19" fill="#6a4630"/>
  <circle cx="164" cy="133" r="14.5" fill="#6a4630"/>
  <g transform="translate(92 133)"><use href="#hub"/></g>
  <g transform="translate(164 133)"><use href="#hub"/></g>
  <path d="M110 147h36l5 5h-46z" fill="#4a4654"/>
  <rect x="44" y="90" width="168" height="30" rx="10" fill="url(#glass)"/>

  <!-- keys: rewind, play, stop, fast forward -->
  <g>
    <rect x="44" y="167" width="38" height="24" rx="6" fill="url(#key)"/>
    <rect x="88" y="167" width="38" height="24" rx="6" fill="url(#red)"/>
    <rect x="132" y="167" width="38" height="24" rx="6" fill="url(#key)"/>
    <rect x="176" y="167" width="36" height="24" rx="6" fill="url(#key)"/>
    <path d="M70 173.5v11l-8-5.5zM62 173.5v11l-8-5.5z" fill="#e9e4d4"/>
    <path d="M102 173v12l11-6z" fill="#ffffff"/>
    <rect x="144" y="173.5" width="11" height="11" rx="1.6" fill="#e9e4d4"/>
    <path d="M186 173.5v11l8-5.5zM194 173.5v11l8-5.5z" fill="#e9e4d4"/>
  </g>
</svg>
